# Testes automáticos do Gênesis. Rodam sozinhos a cada pull request e, na main, antes de
# publicar o site (o workflow "Publicar" chama este). Se algum falhar, nada é publicado.
name: Testes

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  painel:
    name: Painel no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testes/package-lock.json

      - name: Instalar dependências dos testes
        working-directory: testes
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Instalar o Chromium
        working-directory: testes
        run: npx playwright install --with-deps chromium

      - name: Rodar testes do painel e da biblioteca de arquivos
        working-directory: testes
        run: npm test

  servidor:
    name: Regras do copiloto e banco
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regras do copiloto (validação de valores, custos, cenários)
        run: node --experimental-strip-types --test supabase/functions/copiloto/regras.test.ts

      - name: Banco descartável com as migrations + testes SQL
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/rodar.sh
