# Testes automáticos do Gênesis. Rodam sozinhos a cada push e a cada pull request.
# Se algum falhar, o PR fica com um X vermelho e não deve ser mergeado.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  painel:
    name: Painel no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testes/package-lock.json

      - name: Versão do site subiu? (evita o cache servir código velho)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base" HEAD -- index.html; then echo "index.html não mudou."; exit 0; fi
          antes=$(git show "$base:index.html" | grep -o 'name="app-version" content="[^"]*"' || true)
          agora=$(grep -o 'name="app-version" content="[^"]*"' index.html || true)
          echo "antes: $antes"; echo "agora: $agora"
          if [ "$antes" = "$agora" ]; then
            echo "::error file=index.html::O index.html mudou mas a meta app-version continua igual. Suba a versão (AAAAMMDD-HHMMSS) para os navegadores baixarem o código novo."
            exit 1
          fi

      - name: Instalar dependências dos testes
        working-directory: testes
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Instalar o Chromium
        working-directory: testes
        run: npx playwright install --with-deps chromium

      - name: Rodar testes do painel e da biblioteca de arquivos
        working-directory: testes
        run: npm test

  servidor:
    name: Regras do copiloto e banco
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regras do copiloto (validação de valores, custos, cenários)
        run: node --experimental-strip-types --test supabase/functions/copiloto/regras.test.ts

      - name: Banco descartável com as migrations + testes SQL
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/rodar.sh
